        const SESSION_DURATION_MS = 15 * 60 * 60 * 1000;

        // 기존 인천공항 공공데이터 API + 기존 Cloudflare Worker 프록시를 그대로 사용.

        const API_SOURCE_BASE = decodeURIComponent(GATE_API_URL.slice(PROXY_BASE_URL.length));
        const airportDate = (date) => `${date.getFullYear()}${String(date.getMonth()+1).padStart(2,'0')}${String(date.getDate()).padStart(2,'0')}`;
        // 주간 출발 API 공식 규격: D+0~D+6, 날짜 파라미터는 제공되지 않는다.

        const buildFlightAPIUrl = () => PROXY_BASE_URL + encodeURIComponent(API_SOURCE_BASE + '&_ts=' + Date.now());
        const parseFlightsFromXML = (xmlText) => {
            const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
            if(doc.querySelector('parsererror')) throw new Error('운항정보 XML 파싱 오류');
            const read = (node,tag) => node.getElementsByTagName(tag)[0]?.textContent?.trim() || '';
            const resultCode = read(doc,'resultCode') || read(doc,'returnReasonCode');
            const message = read(doc,'resultMsg') || read(doc,'returnAuthMsg') || read(doc,'message');
            if(resultCode && !['00','0000','0','200'].includes(resultCode)) throw new Error(`API 오류 ${resultCode}: ${message||'요청 실패'}`);
            if (/<(?:!doctype|html)/i.test(xmlText.slice(0,250))) throw new Error('API가 XML 대신 HTML을 반환했습니다. 프록시 설정을 확인하세요.');
            const nodes=[...doc.getElementsByTagName('item')];
            if(!nodes.length && !(doc.getElementsByTagName('response').length || doc.getElementsByTagName('OpenAPI_ServiceResponse').length)) throw new Error('API 응답 형식이 예상과 다릅니다.');
            const flights=[];
            for(const item of nodes){
                const flightId=read(item,'flightId').toUpperCase();
                if(!flightId)continue;

                if(!/^\d{12}$/.test(dep))continue;
                flights.push({

                    scheduleDateTime:dep, estimatedDateTime:read(item,'estimatedDateTime'), terminalid:read(item,'terminalid')||read(item,'terminalId'),
                    chkinrange:read(item,'chkinrange'), gatenumber:read(item,'gatenumber'),

                    codeshare:read(item,'codeshare'), masterflightid:read(item,'masterflightid'), fid:read(item,'fid')

            return {flights,total:Number.isFinite(total)?total:0};

  const terminalIds=viewTerm==='ALL'?['P01','P02','P03']:(viewTerm==='T1'?['P01','P02']:['P03']);

 const report=<div id="export-report" className="report"><div style={{borderBottom:'4px solid #3670d8',paddingBottom:18}}><div style={{fontSize:13,color:'#64748b'}}>INCHEON AIRPORT · OPERATIONS MONITOR</div><h1 style={{fontSize:30,margin:'7px 0'}}>공항 장애/운항 현황 보고</h1><div style={{fontSize:16}}>{terminalName(term)} | {filterText} | {fmt(now)}</div><div style={{fontSize:13,color:'#60758a',marginTop:7}}>선택 항공사 {matched.length}개{term==='ALL'&&` (T1 ${matchedByTerm.T1}개 · T2 ${matchedByTerm.T2}개)`} · 데이터 갱신 {lastUpdated?fmt(lastUpdated):'없음'}</div></div><div style={{display:'flex',gap:12,marginTop:18}}>{groups.map(g=><div key={g.id} style={{flex:1,padding:14,background:'#f1f7fd',borderRadius:10}}><div style={{fontSize:12}}>{g.name}</div><b style={{fontSize:25,color:g.color}}>{results.filter(r=>r.state===g.id).length}</b></div>)}</div>{groups.map(g=>{const list=results.filter(r=>r.state===g.id);return list.length?<div className="report-group" key={g.id}><h3 style={{color:g.color}}>{g.name} ({list.length})</h3>{list.map(r=>{const st=statuses[r.iata];return <div className="report-row" key={r.iata}><div style={{minWidth:120}}><b>{r.iata}</b> <span style={{display:'inline-block',fontSize:11,fontWeight:700,background:r.terminal==='T2'?'#f0eaff':'#e4f3ff',color:r.terminal==='T2'?'#6947b8':'#276b9c',padding:'2px 6px',borderRadius:5,marginLeft:5}}>{r.terminal||'미확인'}</span> <span style={{fontSize:12,color:'#687d90'}}>{r.flight?.airline||''}</span></div><div style={{flex:1,fontSize:13}}>{r.flight?`${r.flight.flightId} · ${r.flight.airport} · ${timeOf(r.flight.scheduleDateTime)} 예정 · ${flightStatus(r.flight).label}`:g.name}{r.state==='NOT_OPEN'&&` · ${r.openTime} 오픈 예정`}{st?.text&&<div style={{color:'#b34858',marginTop:4}}>장애 상태: {st.text} ({st.time||''})</div>}</div><span className="report-badge">{r.gate?'G'+r.gate+' · ':''}{r.counter||'-'}</span></div>})}</div>:null})}<div style={{fontSize:11,color:'#8292a6',marginTop:26,borderTop:'1px solid #dce8f3',paddingTop:10}}>본 자료는 공공 운항정보 기반입니다. 체크인 시간대 구분은 출발 3시간 전 기준 추정치이며 실제 수속 상태·장애 여부는 현장 확인이 필요합니다.</div></div>;
 return <div className="shell"><header className="topbar"><div><h1 className="text-2xl font-black">✈️ 공항 장애/현황 모니터링</h1><p className="hint">ICN Ops Monitor · Network / DCS Operations</p></div><div className="flex gap-2"><button className="btn" onClick={loadFlights} disabled={loading} title="운항정보 갱신">↻ <span className="mobile-hide">새로고침</span></button><button className="btn" onClick={openSettings}>⚙ <span className="mobile-hide">설정</span></button></div></header>{settings?SettingsPanel:<><div className="mobile-only mb-3"><div className="flex gap-2">{['조건','항공사','결과'].map((x,i)=><button key={x} className={'btn flex-1 text-sm '+(mobileStep===i?'selected':'')} onClick={()=>setMobileStep(i)}>{i+1}. {x}</button>)}</div></div><div className="desktop-grid"><div className={mobileStep===0?'':'mobile-hide'}>{FilterPanel}</div><div className={mobileStep===1?'':'mobile-hide'}>{AirlinePanel}</div><div className={'results-col '+(mobileStep===2?'':'mobile-hide')}>{ResultPanel}</div></div></>}{detailsIata&&<FlightDetailModal
     iata={detailsIata} flights={todayFlightsForAirline} loading={loading} error={fetchError}

{reportOpen&&<div style={{position:'fixed',inset:0,zIndex:60,background:'rgba(17,40,63,.65)',overflow:'auto',padding:'18px'}}><div className="glass p-4 mx-auto" style={{maxWidth:950}}><div className="flex justify-between items-center gap-2 mb-3"><h2 className="font-black">이미지 보고서 미리보기</h2><div className="flex gap-2"><button className="btn primary" disabled={reportBusy} onClick={exportImage}>{reportBusy?'이미지 생성 중':'PNG 저장 / 공유'}</button><button className="btn" onClick={()=>setReportOpen(false)}>닫기</button></div></div><div style={{overflowX:'auto'}}>{report}</div></div></div>}</div>

function FlightDetailModal({iata,flights,loading,error,lastUpdated,date,onClose,onRefresh,storedStatus}){
 const [filter,setFilter]=useState('all');
 useEffect(()=>{const esc=e=>{if(e.key==='Escape')onClose()};window.addEventListener('keydown',esc);const old=document.body.style.overflow;document.body.style.overflow='hidden';return()=>{window.removeEventListener('keydown',esc);document.body.style.overflow=old}},[onClose]);
 const count=(kind)=>flights.filter(f=>flightStatus(f).kind===kind).length;
 const filters=[{id:'all',label:'전체',number:flights.length},{id:'departed',label:'출발',number:count('departed')},{id:'boarding',label:'탑승중',number:count('boarding')},{id:'delayed',label:'지연',number:count('delayed')},{id:'canceled',label:'결항',number:count('canceled')},{id:'other',label:'기타',number:count('preparing')+count('closedboarding')+count('unknown')}];
 const visible=flights.filter(f=>filter==='all'||(filter==='other'?['preparing','closedboarding','unknown'].includes(flightStatus(f).kind):flightStatus(f).kind===filter));
 const airline=flights.find(f=>f.airline)?.airline||'';
 return <div className="flight-modal-overlay" onMouseDown={e=>{if(e.target===e.currentTarget)onClose()}} role="presentation">
   <div className="flight-modal" role="dialog" aria-modal="true" aria-label={`${iata} 오늘 출발편 전체 목록`}>
     <div className="flight-modal-head">
       <div className="flex justify-between items-start gap-2">
         <div><div className="flex items-center gap-2 flex-wrap"><h2 className="font-black text-xl md:text-2xl">{iata} {airline}</h2><span className="pill bg-blue-50 text-blue-700">오늘 출발편 {flights.length}편</span></div>
           <p className="hint mt-1">{localDayTitle(date)} · 인천공항 출발편 전체(T1+T2) · 항공편의 예정 출발일 기준</p>
           <p className="hint mt-1">API 조회: {lastUpdated?fmt(lastUpdated):'아직 조회 전'} · 편명과 운항 상태는 원본 API 기준</p>
         </div>
         <button className="btn text-sm shrink-0" onClick={onClose} aria-label="닫기">✕ 닫기</button>
       </div>
       {storedStatus?.text&&<div className="api-alert" style={{background:'#fff0f2',borderColor:'#f5c9d0',color:'#9d344b'}}>현장 입력 장애 상태: {storedStatus.text} {storedStatus.time&&`(${storedStatus.time})`}</div>}
       <div className="flex flex-wrap gap-2 mt-4">{filters.map(p=><button key={p.id} className={'btn text-xs px-3 py-2 '+(p.id===filter?'selected':'')} onClick={()=>setFilter(p.id)}>{p.label} {p.number}</button>)}</div>
     </div>
     <div className="flight-modal-body">
       <div className="flex gap-2 items-center justify-between mb-3">
         <div className="hint">{loading?'운항정보 갱신 중…':`표시 ${visible.length}편 / 전체 ${flights.length}편`}</div>
         <button className="btn text-xs" disabled={loading} onClick={onRefresh}>↻ API 다시 조회</button>
       </div>
       {error&&<div className="api-alert">{error} · 기존 조회 내용이 남아 있다면 최신 정보가 아닐 수 있습니다.</div>}
       {!flights.length&&!loading&&<div className="subtle p-7 text-center hint">{error?'API 연결 상태를 확인하세요.':'오늘 출발 항공편이 조회되지 않았습니다. 코드쉐어 편명은 별도 표기되며, 원본 API에서 제공하지 않은 편은 표시되지 않습니다.'}</div>}
       {flights.length>0&&!visible.length&&<div className="subtle p-6 text-center hint">선택한 상태의 운항편이 없습니다.</div>}
       <div className="flight-table-wrap overflow-auto rounded-xl border border-slate-200">
         {visible.length>0&&<table className="flight-table"><thead><tr><th>예정</th><th>편명 / 항공사</th><th>목적지</th><th>터미널</th><th>탑승구</th><th>체크인 카운터</th><th>운항 상태 (API)</th><th>변경 시각</th></tr></thead>
         <tbody>{visible.map((f,i)=><tr key={[f.fid||f.flightId,f.scheduleDateTime,i].join('-')}>
           <td style={{fontWeight:800,whiteSpace:'nowrap'}}>{timeOf(f.scheduleDateTime)}</td>
           <td><b>{f.flightId}</b>{['slave','sl'].includes(f.codeshare.toLowerCase())&&<div className="hint">공동운항 / {f.masterflightid||'마스터편명 미제공'}</div>}</td>
           <td>{f.airport||f.airportCode||'-'}</td>
           <td><span className="pill bg-sky-100 text-blue-800">{flightTerminal(f,'-')}</span></td>

         </tr>)}</tbody></table>}
       </div>
       <div className="md:hidden">{visible.map((f,i)=><div className="flight-mobile-card" key={[f.fid||f.flightId,f.scheduleDateTime,i].join('-')}>
         <div className="flex justify-between gap-2 items-start"><div><div className="font-black text-lg">{timeOf(f.scheduleDateTime)} <span className="text-blue-700">{f.flightId}</span></div><div className="text-sm text-slate-600 mt-1">{f.airport||f.airportCode||'-'}</div></div><span className={'status-chip s-'+flightStatus(f).kind}>{flightStatus(f).label}</span></div>
         <div className="grid grid-cols-3 gap-2 text-xs text-slate-600 mt-3"><div><div className="hint">터미널</div><b>{flightTerminal(f,'-')}</b></div><div><div className="hint">게이트</div><b>{gateText(f.gatenumber)}</b></div><div><div className="hint">체크인 카운터</div><b>{f.chkinrange||'-'}</b></div></div>
         {f.estimatedDateTime&&timeOf(f.estimatedDateTime)!==timeOf(f.scheduleDateTime)&&<div className="text-sm text-amber-700 font-bold mt-2">변경 {timeOf(f.estimatedDateTime)} ({estimateDiff(f)})</div>}
         {['slave','sl'].includes(f.codeshare.toLowerCase())&&<div className="hint mt-2">공동운항편 · 마스터 {f.masterflightid||'확인 필요'}</div>}
       </div>)}</div>
       <p className="hint mt-4">※ 운항 상태는 공공데이터 API의 현황(remark)을 그대로 표시합니다. 공란이면 '상태 미제공'이며 시간 경과만으로 출발·탑승중으로 추정하지 않습니다. 변경 시각은 예정 시각과 비교한 참고 정보입니다.</p>
     </div>
   </div>
 </div>
}
function FlightCard({r,status,recent,onSave,onOpen}){const [expanded,setExpanded]=useState(false),[input,setInput]=useState('');const wait=r.state==='NOT_OPEN';const off=!r.flight;return <article className={'stat '+(wait?'wait':off?'off':'')}><button type="button" className="flight-open" onClick={onOpen} aria-label={`${r.iata} 오늘 전체 출발편 조회`}><div className="flex justify-between gap-2 items-start"><div><div className="font-black text-xl flex items-center flex-wrap gap-1">{r.iata} <span className={'pill text-[10px] '+(r.terminal==='T2'?'bg-violet-100 text-violet-800':'bg-sky-100 text-sky-800')}>{r.terminal||'미확인'}</span><span className="font-normal text-sm text-slate-500">{r.flight?.airline||''}</span></div><div className="text-sm text-slate-600 mt-1">{r.flight?`${r.flight.flightId} | ${r.flight.airport} | ${timeOf(r.flight.scheduleDateTime)} 예정`:(r.state==='CLOSED'?'수속 추정시간 종료':'조회 운항 없음')}</div></div><div className="text-right shrink-0"><div className="flex gap-1 justify-end">{r.gate&&<span className="pill bg-slate-100 text-slate-600">G{r.gate}</span>}{r.counter&&<span className={'pill '+(wait?'bg-amber-100 text-amber-800':'bg-emerald-100 text-emerald-800')}>{r.counter}</span>}</div>{wait&&<div className="text-xs font-bold text-amber-700 mt-2">{r.openTime} 오픈 예상</div>}</div></div><div className="text-xs text-blue-600 font-semibold mt-2">오늘 전체 출발편 · 운항상태 보기 →</div></button>{r.flight&&<div className="mt-2"><span className={"status-chip s-"+flightStatus(r.flight).kind}>{flightStatus(r.flight).label}</span></div>}{status?.text&&<div className="notice mt-3" style={{background:'#fff0f2',color:'#a53b51'}}>상태: {status.text} {status.time&&`(${status.time})`}</div>}<button className="text-xs text-blue-600 font-bold mt-3" onClick={()=>setExpanded(!expanded)}>{expanded?'상태 입력 닫기':'장애 상태 입력 / 수정'}</button>{expanded&&<div className="mt-3 flex flex-col gap-2"><input className="field" placeholder="예: 응답 지연 → 수기 발권" value={input} onChange={e=>setInput(e.target.value)}/>{recent.length>0&&<select className="field" value="" onChange={e=>setInput(e.target.value)}><option value="">기존 입력 불러오기</option>{recent.map(v=><option key={v} value={v}>{v}</option>)}</select>}<button className="btn primary" onClick={()=>{if(!input.trim())return;onSave(r.iata,input);setExpanded(false);setInput('')}}>상태 저장</button></div>}</article>}
