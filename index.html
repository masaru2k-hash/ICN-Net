<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ICN Ops Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #0f172a; overscroll-behavior-y: none;
            -webkit-tap-highlight-color: transparent;
        }
        #wrapper { display: flex; flex-direction: column; height: 100dvh; }
        #content { flex: 1; width: 100%; overflow-y: auto; position: relative; overscroll-behavior-y: contain; }
        
        .pwa-banner {
            position: fixed; bottom: 0; left: 0; width: 100%; background: #333; color: white; padding: 15px;
            display: flex; justify-content: space-between; align-items: center; z-index: 9999;
        }
        .pwa-banner button { background: #4f46e5; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans">

    <div id="wrapper">
        <div id="content"><div id="root" style="height: 100%;"></div></div>
    </div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    
    <script type="text/babel" data-presets="react">
        const { useState, useEffect, useRef, useMemo } = React;

        const PROXY_BASE_URL = 'https://winter-unit-6c7a.masaru2k.workers.dev/?url=';
        const GATE_API_URL = PROXY_BASE_URL + encodeURIComponent('http://apis.data.go.kr/B551177/StatusOfPassengerFlightsDSOdp/getPassengerDeparturesDSOdp?serviceKey=6uC38lshDqWE5U0LuYIGHZ3XeIIEocXrQmhXd11WEmLFLh5ygZSG%2FPNeYov0pyzTU99ISscjIZIp%2FL%2FE2oI%2FYA%3D%3D&type=xml');
        
        const DEFAULT_AIRLINE_INFO = {
            '3U': { term: 'T1', dcs: ['TravelSky'], nw: ['ARINC'] },
            '5J': { term: 'T1', dcs: ['Navitaire'], nw: ['SITA'] },
            '7C': { term: 'T1', dcs: ['Navitaire'], nw: ['SITA'] },
            '8M': { term: 'T1', dcs: ['HITIT'], nw: ['SITA'] },
            '9C': { term: 'T1', dcs: ['IN-HOUSE'], nw: ['SITA'] },
            'AA': { term: 'T1', dcs: ['IN-HOUSE'], nw: ['SITA'] },
            'AC': { term: 'T1', dcs: ['Amadeus'], nw: ['SITA'] },
            'AI': { term: 'T1', dcs: ['Amadeus'], nw: ['SITA'] },
            'CA': { term: 'T1', dcs: ['TravelSky'], nw: ['ARINC'] },
            'CX': { term: 'T1', dcs: ['Amadeus'], nw: ['SITA'] },
            'CZ': { term: 'T1', dcs: ['TravelSky'], nw: ['SITA'] },
            'EK': { term: 'T1', dcs: ['IN-HOUSE'], nw: ['ARINC'] },
            'EY': { term: 'T1', dcs: ['Amadeus'], nw: ['SITA'] },
            'LH': { term: 'T1', dcs: ['Amadeus'], nw: ['SITA'] },
            'MH': { term: 'T1', dcs: ['Amadeus'], nw: ['SITA'] },
            'SQ': { term: 'T1', dcs: ['Amadeus'], nw: ['SITA'] },
            'TG': { term: 'T1', dcs: ['Amadeus'], nw: ['ARINC'] },
            'TW': { term: 'T1', dcs: ['IBS', 'IPORT'], nw: ['SITA'] }, 
            'UA': { term: 'T1', dcs: ['Q-Logic'], nw: ['SITA'] },
            'VJ': { term: 'T1', dcs: ['IPORT'], nw: ['ARINC'] },
            'VN': { term: 'T1', dcs: ['Amadeus'], nw: ['SITA'] },
            'WE': { term: 'T1', dcs: ['IBS'], nw: ['전용망'] },
            
            'AF': { term: 'T2', dcs: ['Amadeus'], nw: ['ARINC'] },
            'AM': { term: 'T2', dcs: ['SABRE'], nw: ['SITA'] },
            'BX': { term: 'T2', dcs: ['IN-HOUSE'], nw: ['ARINC'] },
            'CI': { term: 'T2', dcs: ['Amadeus'], nw: ['ARINC'] },
            'DL': { term: 'T2', dcs: ['IN-HOUSE'], nw: ['전용망'] },
            'KE': { term: 'T2', dcs: ['Amadeus'], nw: ['ARINC'] },
            'KL': { term: 'T2', dcs: ['Amadeus'], nw: ['ARINC'] },
            'LJ': { term: 'T2', dcs: ['IBS'], nw: ['ARINC'] },
            'OZ': { term: 'T2', dcs: ['Amadeus'], nw: ['SITA'] }
        };

        const DEFAULT_TEMPLATES = {
            active: "- {iata} {time} {status}",
            wait: "- {iata} {time} {status}",
            closed: "- {iata} 마감",
            noFlight: "- {iata} 운항없음"
        };

        const Page = { 
            Login: -1,
            Main: 0, 
            SearchSelect: 1, 
            VendorSelect: 2, 
            DualSelect: 3,
            ResultList: 4,
            Settings: 5
        };

        const SESSION_DURATION_MS = 15 * 60 * 60 * 1000;

        const parseFlightsFromXML = (xmlText) => {
            const parser = new DOMParser(); 
            const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
            const items = xmlDoc.getElementsByTagName('item'); 
            const flights = [];
            
            for (let i = 0; i < items.length; i++) {
                const item = items[i]; 
                const cs = item.querySelector('codeshare')?.textContent?.trim();
                if (cs === 'Slave' || cs === 'slave') continue; 
                
                const flightId = item.querySelector('flightId')?.textContent ?? '';
                const iataCode = flightId.length >= 2 ? flightId.substring(0, 2).toUpperCase() : '';
                
                flights.push({
                    flightId: flightId,
                    iata: iataCode,
                    airline: item.querySelector('airline')?.textContent ?? '',
                    airport: item.querySelector('airport')?.textContent ?? item.querySelector('airportCode')?.textContent ?? '',
                    scheduleDateTime: item.querySelector('scheduleDateTime')?.textContent ?? '', 
                    terminalid: item.querySelector('terminalid')?.textContent ?? '',
                    chkinrange: item.querySelector('chkinrange')?.textContent ?? '',
                    gatenumber: item.querySelector('gatenumber')?.textContent ?? '' 
                });
            }
            return flights;
        };

        const fetchFlightData = async () => {
            const f = (d) => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
            const t = f(new Date()); 
            const tm = f(new Date(new Date().setDate(new Date().getDate() + 1)));
            const urls = [
                `${GATE_API_URL}&selectdate=${t}&from_time=0000&to_time=2359`,
                `${GATE_API_URL}&selectdate=${tm}&from_time=0000&to_time=2359`
            ];
            const xmls = await Promise.all(urls.map(u => fetch(u).then(res => res.text())));
            const all = xmls.flatMap(x => parseFlightsFromXML(x));
            return all.sort((a, b) => a.scheduleDateTime.localeCompare(b.scheduleDateTime));
        };

        const getDepMs = (dtStr) => {
            if (!dtStr || dtStr.length < 12) return 0;
            return new Date(
                parseInt(dtStr.substring(0, 4)), parseInt(dtStr.substring(4, 6)) - 1,
                parseInt(dtStr.substring(6, 8)), parseInt(dtStr.substring(8, 10)), parseInt(dtStr.substring(10, 12))
            ).getTime();
        };

        const Header = ({ onBack, title, onSettings, onRefresh }) => (
            <header className="bg-slate-800 p-4 shadow-lg sticky top-0 z-10 flex items-center justify-between h-16 shrink-0">
                <div className="flex items-center w-full overflow-hidden">
                    {onBack && <button onClick={onBack} className="text-indigo-400 text-3xl mr-3 leading-none pb-1 shrink-0">&#8592;</button>}
                    <h1 className="text-xl font-bold text-white truncate flex-1">{title}</h1>
                </div>
                <div className="flex shrink-0 ml-2">
                    {onRefresh && (
                        <button onClick={onRefresh} className="text-emerald-400 p-2 mr-1 hover:bg-slate-700 rounded-full transition">
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                            </svg>
                        </button>
                    )}
                    {onSettings && (
                        <button onClick={onSettings} className="text-slate-300 p-2">
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        </button>
                    )}
                </div>
            </header>
        );

        const AirlineResultCard = ({ data, savedStatus, onSaveStatus, recentStatuses }) => {
            const [expanded, setExpanded] = useState(false);
            const [inputText, setInputText] = useState('');
            const formatTime = (dt) => `${dt.substring(8,10)}:${dt.substring(10,12)}`;

            const handleSave = (e) => {
                e.stopPropagation();
                if(inputText.trim()) {
                    onSaveStatus(data.iata, inputText.trim());
                    setExpanded(false);
                    setInputText('');
                }
            };

            const isCheckIn = data.state === 'CHECK_IN';
            const borderColor = isCheckIn ? 'border-emerald-500' : 'border-amber-500';
            const badgeBg = isCheckIn ? 'bg-emerald-900 text-emerald-300' : 'bg-amber-900 text-amber-300';

            return (
                <div className={`bg-slate-800 border-l-4 ${borderColor} p-3 rounded shadow mb-3 transition-all duration-200`}>
                    <div onClick={() => setExpanded(!expanded)} className="cursor-pointer">
                        <div className="flex justify-between items-center mb-1">
                            <div className="font-bold text-xl text-white">
                                {data.iata} <span className="text-sm font-normal text-slate-400 ml-1">{data.flight.airline}</span>
                            </div>
                            <div className="flex gap-1.5">
                                {data.gate && <div className="bg-slate-700 text-slate-200 px-2 py-0.5 rounded text-sm font-bold border border-slate-600">G{data.gate}</div>}
                                <div className={`px-2 py-0.5 rounded text-sm font-bold border border-transparent ${badgeBg}`}>
                                    {data.counter}
                                </div>
                            </div>
                        </div>
                        <div className="text-slate-300 text-sm">
                            {data.flight.flightId} | {data.flight.airport} | {formatTime(data.flight.scheduleDateTime)} 출발
                            {data.state === 'NOT_OPEN' && <span className="ml-2 text-amber-400 font-bold">({data.openTime} 예정)</span>}
                        </div>
                        
                        {savedStatus && (
                            <div className="mt-2 inline-flex items-center gap-1.5 bg-rose-900/60 border border-rose-500 text-rose-200 text-[14px] font-bold px-2 py-1 rounded">
                                <span className="text-rose-400 text-xs">상태:</span> {savedStatus}
                            </div>
                        )}
                    </div>
                    
                    {expanded && (
                        <div className="mt-4 border-t border-slate-700 pt-3 animate-[fadeIn_0.2s_ease-out]">
                            <div className="flex gap-2 mb-2">
                                <input 
                                    type="text" 
                                    value={inputText}
                                    onChange={(e) => setInputText(e.target.value)}
                                    onClick={(e) => e.stopPropagation()}
                                    placeholder="장애 상태 (예: 응답지연 -> 수기발권)" 
                                    className="flex-1 bg-slate-900 border border-slate-600 rounded p-2 text-white text-sm outline-none focus:border-indigo-500"
                                />
                                <button onClick={handleSave} className="bg-red-600 hover:bg-red-500 text-white font-bold px-4 py-2 rounded shrink-0">
                                    저장
                                </button>
                            </div>
                            
                            {recentStatuses && recentStatuses.length > 0 && (
                                <select 
                                    onChange={(e) => { if(e.target.value) setInputText(e.target.value); }}
                                    className="w-full bg-slate-700 border border-slate-600 rounded p-2 text-slate-300 text-sm outline-none cursor-pointer"
                                    defaultValue=""
                                >
                                    <option value="" disabled>-- 🔽 기존 입력 상태 불러오기 --</option>
                                    {recentStatuses.map((s, idx) => (
                                        <option key={idx} value={s}>{s}</option>
                                    ))}
                                </select>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [auth, setAuth] = useState(() => {
                const savedSession = localStorage.getItem('appAuthSession');
                if (savedSession) {
                    const sessionData = JSON.parse(savedSession);
                    if (Date.now() - sessionData.timestamp < SESSION_DURATION_MS) {
                        return true;
                    } else {
                        localStorage.removeItem('appAuthSession');
                    }
                }
                return false;
            });
            const [pinInput, setPinInput] = useState('');
            const APP_PIN = "1234";

            const [page, setPage] = useState(auth ? Page.Main : Page.Login);
            const [flights, setFlights] = useState([]);
            const [loading, setLoading] = useState(false);
            const [showExitModal, setShowExitModal] = useState(false);
            const isExitModalOpen = useRef(false);
            
            const [airlinesData, setAirlinesData] = useState(() => {
                const saved = localStorage.getItem('airlineData');
                return saved ? JSON.parse(saved) : DEFAULT_AIRLINE_INFO;
            });

            const [airlineStatuses, setAirlineStatuses] = useState(() => {
                const saved = localStorage.getItem('airlineStatuses');
                return saved ? JSON.parse(saved) : {};
            });

            const [copyTemplates, setCopyTemplates] = useState(() => {
                const saved = localStorage.getItem('copyTemplates');
                return saved ? JSON.parse(saved) : DEFAULT_TEMPLATES;
            });

            const [searchMode, setSearchMode] = useState('');
            const [selTerm, setSelTerm] = useState('T1');
            const [selNw, setSelNw] = useState('');
            const [selDcs, setSelDcs] = useState('');
            const [matchingIatas, setMatchingIatas] = useState([]);
            
            const [recentStatuses, setRecentStatuses] = useState(() => {
                const saved = localStorage.getItem('recentStatuses');
                return saved ? JSON.parse(saved) : [];
            });

            useEffect(() => { isExitModalOpen.current = showExitModal; }, [showExitModal]);

            useEffect(() => {
                const checkAuthSession = () => {
                    const savedSession = localStorage.getItem('appAuthSession');
                    if (savedSession) {
                        const sessionData = JSON.parse(savedSession);
                        if (Date.now() - sessionData.timestamp >= SESSION_DURATION_MS) {
                            setAuth(false);
                            setPage(Page.Login);
                            localStorage.removeItem('appAuthSession');
                        }
                    }
                };

                const handleVisibilityChange = () => {
                    if (document.visibilityState === 'visible') checkAuthSession();
                };

                window.addEventListener('visibilitychange', handleVisibilityChange);
                window.addEventListener('focus', checkAuthSession);

                return () => {
                    window.removeEventListener('visibilitychange', handleVisibilityChange);
                    window.removeEventListener('focus', checkAuthSession);
                };
            }, []);

            useEffect(() => {
                if (!auth) return;
                
                const initHistory = () => {
                    window.history.replaceState({ page: 'root' }, '');
                    window.history.pushState({ page: Page.Main }, '');
                };

                const handlePopState = (e) => {
                    if (e.state && e.state.page === 'root') {
                        if (isExitModalOpen.current) {
                            if (navigator.app) navigator.app.exitApp();
                            else window.history.back(); 
                        } else {
                            setShowExitModal(true);
                            window.history.pushState({ page: Page.Main }, '');
                        }
                    } else if (e.state && e.state.page !== undefined) {
                        setPage(e.state.page);
                        setShowExitModal(false);
                    }
                };

                initHistory();
                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, [auth]);

            useEffect(() => {
                if (auth) localStorage.setItem('appAuth', 'true');
            }, [auth]);

            useEffect(() => localStorage.setItem('airlineData', JSON.stringify(airlinesData)), [airlinesData]);
            useEffect(() => localStorage.setItem('recentStatuses', JSON.stringify(recentStatuses)), [recentStatuses]);
            useEffect(() => localStorage.setItem('airlineStatuses', JSON.stringify(airlineStatuses)), [airlineStatuses]);
            useEffect(() => localStorage.setItem('copyTemplates', JSON.stringify(copyTemplates)), [copyTemplates]);

            const loadFlights = async (forceRefetch = false) => {
                if (!forceRefetch && flights.length > 0) return;
                setLoading(true);
                try { setFlights(await fetchFlightData()); } catch(e) { console.error(e); }
                finally { setLoading(false); }
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (pinInput === APP_PIN) {
                    setAuth(true);
                    localStorage.setItem('appAuthSession', JSON.stringify({ timestamp: Date.now() }));
                    
                    setPage(Page.Main);
                    window.history.replaceState({ page: 'root' }, '');
                    window.history.pushState({ page: Page.Main }, '');
                } else {
                    alert("비밀번호가 일치하지 않습니다.");
                    setPinInput('');
                }
            };

            const nav = (p) => {
                window.history.pushState({ page: p }, '');
                setPage(p);
            };
            const back = () => window.history.back();

            const handleSaveStatus = (iata, newStatus) => {
                setAirlineStatuses(prev => ({ ...prev, [iata]: newStatus }));
                if (!recentStatuses.includes(newStatus)) {
                    setRecentStatuses(prev => [newStatus, ...prev].slice(0, 10));
                }
            };

            const getAvailableOptions = (type) => {
                const s = new Set();
                Object.values(airlinesData).forEach(info => {
                    if (info.term === selTerm) {
                        if (type === 'nw' || type === 'both') info.nw.forEach(v => s.add(v.toUpperCase()));
                        if (type === 'dcs' || type === 'both') info.dcs.forEach(v => s.add(v.toUpperCase()));
                    }
                });
                return Array.from(s).sort();
            };

            const executeSearch = (mode, nwVal, dcsVal) => {
                const matched = Object.keys(airlinesData).filter(iata => {
                    const info = airlinesData[iata];
                    if (info.term !== selTerm) return false;
                    
                    const hasNw = nwVal ? info.nw.map(v=>v.toUpperCase()).includes(nwVal) : true;
                    const hasDcs = dcsVal ? info.dcs.map(v=>v.toUpperCase()).includes(dcsVal) : true;

                    if (mode === 'NW') return hasNw;
                    if (mode === 'DCS') return hasDcs;
                    if (mode === 'BOTH') return hasNw && hasDcs;
                    return false;
                });

                setMatchingIatas(matched);
                if (flights.length === 0) setLoading(true);
                nav(Page.ResultList);
                loadFlights().catch(e => console.error(e));
            };

            const formatCopyItem = (r, template) => {
                let res = template;
                const flightTime = r.flight ? `${r.flight.scheduleDateTime.substring(8,10)}:${r.flight.scheduleDateTime.substring(10,12)}` : '';
                res = res.replace(/{iata}/g, r.iata || '');
                res = res.replace(/{airline}/g, (r.flight && r.flight.airline) || '');
                res = res.replace(/{time}/g, flightTime);
                res = res.replace(/{counter}/g, r.counter || '미정');
                res = res.replace(/{gate}/g, r.gate ? 'G'+r.gate : '미정');
                res = res.replace(/{openTime}/g, r.openTime || '');
                res = res.replace(/{status}/g, airlineStatuses[r.iata] || '');
                // 빈 공백 여러개를 하나로 줄이고 앞뒤 공백 제거
                return res.replace(/ {2,}/g, ' ').trim();
            };

            const StatusResultPage = () => {
                const [showClosed, setShowClosed] = useState(false);
                const now = new Date();
                const nowMs = now.getTime();
                const todayStr = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;

                const results = matchingIatas.map(iata => {
                    const info = airlinesData[iata];
                    const termFlights = flights.filter(f => {
                        const isMatch = f.iata === iata && (info.term === 'T1' ? (f.terminalid === 'P01' || f.terminalid === 'P02') : f.terminalid === 'P03');
                        if (!isMatch) return false;
                        return f.scheduleDateTime.startsWith(todayStr);
                    });

                    if (termFlights.length === 0) return { iata, state: 'NO_FLIGHT' };

                    const openFlights = termFlights.filter(f => {
                        const diffMins = (getDepMs(f.scheduleDateTime) - nowMs) / 60000;
                        return diffMins >= -60 && diffMins <= 180; 
                    });

                    const futureFlights = termFlights.filter(f => {
                        return getDepMs(f.scheduleDateTime) > nowMs + (180 * 60000);
                    });

                    if (openFlights.length > 0) {
                        const tgt = openFlights[0];
                        return { iata, state: 'CHECK_IN', flight: tgt, counter: tgt.chkinrange || '확인요망', gate: tgt.gatenumber };
                    } else if (futureFlights.length > 0) {
                        const tgt = futureFlights[0];
                        const d = new Date(getDepMs(tgt.scheduleDateTime));
                        d.setHours(d.getHours() - 3);
                        const openTimeStr = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                        return { iata, state: 'NOT_OPEN', flight: tgt, counter: tgt.chkinrange || '미배정', gate: tgt.gatenumber, openTime: openTimeStr };
                    } else {
                        return { iata, state: 'CLOSED' };
                    }
                });

                const activeList = results.filter(r => r.state === 'CHECK_IN');
                const waitList = results.filter(r => r.state === 'NOT_OPEN');
                const closedList = results.filter(r => r.state === 'CLOSED');
                const noFlightList = results.filter(r => r.state === 'NO_FLIGHT'); 

                const handleCopy = (type) => {
                    let textLines = [];
                    
                    const addSection = (title, list, tplKey) => {
                        if(list.length > 0) {
                            textLines.push(`[${title}]`);
                            list.forEach(item => textLines.push(formatCopyItem(item, copyTemplates[tplKey])));
                        }
                    };

                    if (type === 'OPEN') {
                        addSection('오픈', activeList, 'active');
                    } else if (type === 'OPEN_WAIT') {
                        addSection('오픈', activeList, 'active');
                        addSection('오픈예정', waitList, 'wait');
                    } else if (type === 'ALL') {
                        addSection('오픈', activeList, 'active');
                        addSection('오픈예정', waitList, 'wait');
                        addSection('마감', closedList, 'closed');
                        addSection('운항없음', noFlightList, 'noFlight');
                    }

                    const finalText = textLines.join('\n').trim();
                    if(!finalText) {
                        alert('복사할 데이터가 없습니다.');
                        return;
                    }

                    navigator.clipboard.writeText(finalText)
                        .then(() => alert('현황이 클립보드에 복사되었습니다.'))
                        .catch(() => alert('복사 실패'));
                };

                return (
                    <div className="flex flex-col h-full relative">
                        <Header 
                            onBack={back} 
                            title={`조회 결과 (${matchingIatas.length}개사)`} 
                            onRefresh={() => loadFlights(true)}
                        />
                        
                        <div className="flex-grow overflow-y-auto p-4 pb-10">
                            {loading ? (
                                <div className="flex flex-col items-center justify-center py-20 gap-4 h-full animate-[fadeIn_0.2s_ease-out]">
                                    <div className="animate-spin rounded-full h-12 w-12 border-b-4 border-indigo-500"></div>
                                    <div className="text-slate-300 font-bold text-base">실시간 데이터 조회 중...</div>
                                </div>
                            ) : (
                                <div className="space-y-6 animate-[fadeIn_0.3s_ease-out]">
                                    {activeList.length > 0 && (
                                        <div>
                                            <h2 className="text-emerald-400 font-bold mb-3 flex justify-between border-b border-slate-700 pb-2">
                                                <span>수속 진행중 (체크인)</span>
                                                <span className="text-white">{activeList.length}</span>
                                            </h2>
                                            <div>
                                                {activeList.map(r => (
                                                    <AirlineResultCard 
                                                        key={r.iata} 
                                                        data={r} 
                                                        savedStatus={airlineStatuses[r.iata]}
                                                        onSaveStatus={handleSaveStatus}
                                                        recentStatuses={recentStatuses}
                                                    />
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {waitList.length > 0 && (
                                        <div>
                                            <h2 className="text-amber-400 font-bold mb-3 flex justify-between border-b border-slate-700 pb-2">
                                                <span>오픈 대기중</span>
                                                <span className="text-white">{waitList.length}</span>
                                            </h2>
                                            <div>
                                                {waitList.map(r => (
                                                    <AirlineResultCard 
                                                        key={r.iata} 
                                                        data={r} 
                                                        savedStatus={airlineStatuses[r.iata]}
                                                        onSaveStatus={handleSaveStatus}
                                                        recentStatuses={recentStatuses}
                                                    />
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    <div className="pt-4">
                                        <button onClick={() => setShowClosed(!showClosed)} className="w-full bg-slate-800 p-3 rounded flex justify-between items-center text-sm text-slate-400 font-bold border border-slate-700">
                                            <span>운항 종료 및 마감 항공사 보기</span>
                                            <span>{showClosed ? '▲' : '▼'} ({closedList.length + noFlightList.length})</span>
                                        </button>
                                        
                                        {showClosed && (
                                            <div className="grid grid-cols-3 gap-2 mt-3 animate-[fadeIn_0.2s_ease-out]">
                                                {closedList.map(r => (
                                                    <div key={r.iata} className="bg-slate-800/80 text-slate-400 p-2 rounded text-center text-[13px] font-bold border border-slate-700/80">
                                                        {r.iata} <br/><span className="text-xs font-normal">마감/종료</span>
                                                    </div>
                                                ))}
                                                {noFlightList.map(r => (
                                                    <div key={r.iata} className="bg-slate-900/50 text-slate-600 p-2 rounded text-center text-[13px] font-bold border border-slate-800">
                                                        {r.iata} <br/><span className="text-xs font-normal">금일 운항없음</span>
                                                    </div>
                                                ))}
                                                {(closedList.length === 0 && noFlightList.length === 0) && (
                                                    <div className="col-span-3 text-center text-xs py-2 text-slate-600">해당 조건 내역 없음</div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                    
                                    <div className="mt-8 border-t border-slate-700 pt-5 pb-6">
                                        <h3 className="font-bold text-slate-300 mb-3 text-sm text-center">📋 현황 리스트 클립보드 복사</h3>
                                        <div className="flex gap-2">
                                            <button onClick={() => handleCopy('OPEN')} className="flex-1 bg-slate-700 hover:bg-slate-600 py-3 rounded text-[13px] font-bold shadow-md transition text-emerald-300 border border-slate-600">
                                                오픈중 전체
                                            </button>
                                            <button onClick={() => handleCopy('OPEN_WAIT')} className="flex-1 bg-indigo-700 hover:bg-indigo-600 py-3 rounded text-[13px] font-bold shadow-md transition border border-indigo-500 text-white">
                                                오픈/예정 전체
                                            </button>
                                            <button onClick={() => handleCopy('ALL')} className="flex-1 bg-slate-700 hover:bg-slate-600 py-3 rounded text-[13px] font-bold shadow-md transition text-slate-300 border border-slate-600">
                                                모든 내역 (마감포함)
                                            </button>
                                        </div>
                                    </div>
                                    
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const SettingsPage = () => {
                const [editMode, setEditMode] = useState(null); 
                const [formData, setFormData] = useState({ iata: '', term: 'T1', nw: '', dcs: '' });
                const [tempTpl, setTempTpl] = useState(copyTemplates);

                const handleEdit = (iata) => {
                    const d = airlinesData[iata];
                    setFormData({ iata, term: d.term, nw: d.nw.join(', '), dcs: d.dcs.join(', ') });
                    setEditMode(iata);
                };
                
                const handleSave = () => {
                    if(!formData.iata) return;
                    const newData = { ...airlinesData };
                    newData[formData.iata.toUpperCase()] = {
                        term: formData.term,
                        nw: formData.nw.split(',').map(s=>s.trim()).filter(Boolean),
                        dcs: formData.dcs.split(',').map(s=>s.trim()).filter(Boolean)
                    };
                    setAirlinesData(newData);
                    setEditMode(null);
                };
                
                const handleClearAirlineStatuses = () => {
                    if(confirm("모든 항공사에 입력된 상태 뱃지를 지우시겠습니까?\n(입력된 장애 현황이 모두 삭제됩니다)")) {
                        setAirlineStatuses({});
                    }
                };

                const handleClearRecentStatuses = () => {
                    if(confirm("입력창의 드롭다운 자동완성 히스토리를 비우시겠습니까?")) {
                        setRecentStatuses([]);
                    }
                };

                const handleSaveTemplates = () => {
                    setCopyTemplates(tempTpl);
                    alert('복사 양식이 저장되었습니다.');
                };

                return (
                    <div className="flex flex-col h-full bg-slate-900">
                        <Header onBack={back} title="데이터 설정 및 관리" />
                        <div className="flex-grow overflow-y-auto p-4 pb-20">
                            
                            {/* 데이터 초기화 */}
                            <div className="bg-slate-800 p-4 rounded-lg mb-6 border border-slate-700">
                                <h3 className="font-bold text-rose-400 mb-3 flex items-center gap-2">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                    데이터 초기화 관리
                                </h3>
                                <div className="space-y-3">
                                    <button onClick={handleClearAirlineStatuses} className="w-full bg-slate-900 border border-rose-900/50 hover:bg-rose-900/30 text-rose-300 py-3 rounded font-bold text-[13px] transition">
                                        현재 입력된 [항공사별 장애 상태] 모두 비우기
                                    </button>
                                    <button onClick={handleClearRecentStatuses} className="w-full bg-slate-900 border border-slate-700 hover:bg-slate-700 text-slate-300 py-3 rounded font-bold text-[13px] transition">
                                        입력창 [자동완성 히스토리] 비우기
                                    </button>
                                </div>
                            </div>

                            {/* 클립보드 커스텀 설정 */}
                            <div className="bg-slate-800 p-4 rounded-lg mb-6 border border-slate-700">
                                <h3 className="font-bold text-emerald-400 mb-3">📋 클립보드 복사 양식 설정</h3>
                                <div className="text-xs text-slate-400 mb-3 bg-slate-900 p-3 rounded leading-relaxed border border-slate-700/50">
                                    <span className="font-bold text-slate-300">[사용 가능 변수]</span><br/>
                                    {'{iata}'}: 항공사코드 (예: KE)<br/>
                                    {'{airline}'}: 항공사명 (예: 대한항공)<br/>
                                    {'{time}'}: 출발시간 (예: 14:30)<br/>
                                    {'{status}'}: 입력한 장애상태<br/>
                                    {'{counter}'}: 체크인 카운터<br/>
                                    {'{gate}'}: 탑승구 (예: G253)
                                </div>
                                <div className="space-y-3">
                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">수속 진행중 (오픈)</label>
                                        <input value={tempTpl.active} onChange={e=>setTempTpl({...tempTpl, active: e.target.value})} className="w-full bg-slate-900 p-2 rounded text-sm text-white border border-slate-700 focus:border-indigo-500 outline-none" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">오픈 대기중 (예정)</label>
                                        <input value={tempTpl.wait} onChange={e=>setTempTpl({...tempTpl, wait: e.target.value})} className="w-full bg-slate-900 p-2 rounded text-sm text-white border border-slate-700 focus:border-indigo-500 outline-none" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">마감 및 종료</label>
                                        <input value={tempTpl.closed} onChange={e=>setTempTpl({...tempTpl, closed: e.target.value})} className="w-full bg-slate-900 p-2 rounded text-sm text-white border border-slate-700 focus:border-indigo-500 outline-none" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-slate-400 block mb-1">금일 운항 없음</label>
                                        <input value={tempTpl.noFlight} onChange={e=>setTempTpl({...tempTpl, noFlight: e.target.value})} className="w-full bg-slate-900 p-2 rounded text-sm text-white border border-slate-700 focus:border-indigo-500 outline-none" />
                                    </div>
                                    <button onClick={handleSaveTemplates} className="w-full bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded text-sm font-bold mt-2 transition">양식 저장</button>
                                </div>
                            </div>

                            {/* 항공사 네트워크 관리 (인라인 수정 방식) */}
                            <div className="flex justify-between items-center mb-4 border-t border-slate-700 pt-6">
                                <h3 className="font-bold text-lg text-indigo-300">항공사 네트워크 정보</h3>
                                <button onClick={() => {setFormData({iata:'', term:'T1', nw:'', dcs:''}); setEditMode('NEW');}} className="bg-indigo-600 hover:bg-indigo-500 text-xs px-3 py-1.5 rounded font-bold transition">신규 추가</button>
                            </div>

                            {/* 신규 추가 입력창 */}
                            {editMode === 'NEW' && (
                                <div className="bg-slate-800 p-4 rounded-lg mb-4 border border-indigo-500 shadow-lg animate-[fadeIn_0.2s_ease-out]">
                                    <div className="grid grid-cols-2 gap-3 mb-3">
                                        <div>
                                            <label className="text-xs text-slate-400 block mb-1">IATA 코드</label>
                                            <input value={formData.iata} onChange={e=>setFormData({...formData, iata: e.target.value})} className="w-full bg-slate-900 p-2 rounded text-sm text-white border border-slate-700" placeholder="e.g. KE" />
                                        </div>
                                        <div>
                                            <label className="text-xs text-slate-400 block mb-1">터미널</label>
                                            <select value={formData.term} onChange={e=>setFormData({...formData, term: e.target.value})} className="w-full bg-slate-900 p-2 rounded text-sm text-white border border-slate-700">
                                                <option>T1</option>
                                                <option>T2</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div className="mb-3">
                                        <label className="text-xs text-slate-400 block mb-1">Network 망 (콤마 분리)</label>
                                        <input value={formData.nw} onChange={e=>setFormData({...formData, nw: e.target.value})} className="w-full bg-slate-900 p-2 rounded text-sm text-white border border-slate-700" placeholder="ARINC, SITA..." />
                                    </div>
                                    <div className="mb-4">
                                        <label className="text-xs text-slate-400 block mb-1">DCS (콤마 분리)</label>
                                        <input value={formData.dcs} onChange={e=>setFormData({...formData, dcs: e.target.value})} className="w-full bg-slate-900 p-2 rounded text-sm text-white border border-slate-700" placeholder="Amadeus, Navitaire..." />
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => setEditMode(null)} className="flex-1 bg-slate-600 py-2 rounded text-sm font-bold">취소</button>
                                        <button onClick={handleSave} className="flex-1 bg-indigo-600 py-2 rounded text-sm font-bold">저장</button>
                                    </div>
                                </div>
                            )}

                            <div className="space-y-2">
                                {Object.keys(airlinesData).sort().map(iata => {
                                    const d = airlinesData[iata];
                                    const isEditing = editMode === iata;
                                    return (
                                        <div key={iata} className="bg-slate-800 p-3 rounded flex flex-col border border-slate-700/50">
                                            {!isEditing ? (
                                                <div className="flex justify-between items-center cursor-pointer" onClick={() => handleEdit(iata)}>
                                                    <div>
                                                        <div className="font-bold text-indigo-300">{iata} <span className="text-xs bg-slate-700 text-slate-300 px-1 rounded ml-1">{d.term}</span></div>
                                                        <div className="text-xs text-slate-400 mt-1">NW: {d.nw.join(', ')} | DCS: {d.dcs.join(', ')}</div>
                                                    </div>
                                                    <button className="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded font-bold transition">수정</button>
                                                </div>
                                            ) : (
                                                <div className="animate-[fadeIn_0.2s_ease-out]">
                                                    <div className="grid grid-cols-2 gap-3 mb-3">
                                                        <div>
                                                            <label className="text-xs text-slate-400 block mb-1">IATA 코드</label>
                                                            <input value={formData.iata} disabled className="w-full bg-slate-900/50 p-2 rounded text-sm text-slate-500 border border-slate-700" />
                                                        </div>
                                                        <div>
                                                            <label className="text-xs text-slate-400 block mb-1">터미널</label>
                                                            <select value={formData.term} onChange={e=>setFormData({...formData, term: e.target.value})} className="w-full bg-slate-900 p-2 rounded text-sm text-white border border-slate-700">
                                                                <option>T1</option>
                                                                <option>T2</option>
                                                            </select>
                                                        </div>
                                                    </div>
                                                    <div className="mb-3">
                                                        <label className="text-xs text-slate-400 block mb-1">Network 망 (콤마 분리)</label>
                                                        <input value={formData.nw} onChange={e=>setFormData({...formData, nw: e.target.value})} className="w-full bg-slate-900 p-2 rounded text-sm text-white border border-slate-700 focus:border-indigo-500 outline-none" />
                                                    </div>
                                                    <div className="mb-4">
                                                        <label className="text-xs text-slate-400 block mb-1">DCS (콤마 분리)</label>
                                                        <input value={formData.dcs} onChange={e=>setFormData({...formData, dcs: e.target.value})} className="w-full bg-slate-900 p-2 rounded text-sm text-white border border-slate-700 focus:border-indigo-500 outline-none" />
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <button onClick={() => setEditMode(null)} className="flex-1 bg-slate-600 hover:bg-slate-500 py-2.5 rounded text-sm font-bold transition">취소</button>
                                                        <button onClick={handleSave} className="flex-1 bg-indigo-600 hover:bg-indigo-500 py-2.5 rounded text-sm font-bold transition">저장</button>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    </div>
                );
            };

            const renderContent = () => {
                switch (page) {
                    case Page.Login:
                        return (
                            <div className="flex flex-col h-full items-center justify-center p-6 bg-slate-900">
                                <div className="text-4xl font-bold text-indigo-500 mb-2">ICN Status</div>
                                <div className="text-slate-400 mb-8 text-sm">접근 코드를 입력해주세요</div>
                                <form onSubmit={handleLogin} className="w-full max-w-xs flex flex-col gap-4">
                                    <input type="password" value={pinInput} onChange={e=>setPinInput(e.target.value)} 
                                           className="w-full bg-slate-800 p-4 rounded-lg text-center text-2xl tracking-widest text-white outline-none border border-slate-700 focus:border-indigo-500" 
                                           placeholder="****" />
                                    <button type="submit" className="w-full bg-indigo-600 py-4 rounded-lg font-bold text-lg shadow-lg">접속</button>
                                </form>
                            </div>
                        );

                    case Page.Main:
                        return (
                            <div className="flex flex-col h-full">
                                <Header title="공항 장애/현황 모니터링" onSettings={() => nav(Page.Settings)} />
                                <main className="flex-grow p-5 flex flex-col gap-4">
                                    <div className="text-slate-400 text-sm mb-2">장애 발생 터미널을 선택하세요</div>
                                    <button onClick={() => { setSelTerm('T1'); nav(Page.SearchSelect); }} className="p-8 rounded-lg text-2xl font-bold bg-cyan-800 shadow-lg flex items-center justify-between">
                                        <span>T1 현황 파악</span><span className="text-cyan-400">❯</span>
                                    </button>
                                    <button onClick={() => { setSelTerm('T2'); nav(Page.SearchSelect); }} className="p-8 rounded-lg text-2xl font-bold bg-emerald-800 shadow-lg flex items-center justify-between">
                                        <span>T2 현황 파악</span><span className="text-emerald-400">❯</span>
                                    </button>
                                </main>
                            </div>
                        );
                    
                    case Page.SearchSelect:
                        return (
                            <div className="flex flex-col h-full">
                                <Header onBack={back} title={`${selTerm} 검색 기준 선택`} />
                                <main className="flex-grow p-5 flex flex-col gap-4">
                                    <button onClick={() => { setSearchMode('NW'); nav(Page.VendorSelect); }} className="p-6 rounded-lg text-xl font-bold bg-blue-700 shadow text-left">네트워크망 기준으로 검색</button>
                                    <button onClick={() => { setSearchMode('DCS'); nav(Page.VendorSelect); }} className="p-6 rounded-lg text-xl font-bold bg-purple-700 shadow text-left">DCS 기준으로 검색</button>
                                    <button onClick={() => { setSearchMode('BOTH'); nav(Page.DualSelect); }} className="p-6 rounded-lg text-xl font-bold bg-rose-700 shadow text-left border-2 border-rose-500/50">
                                        네트워크망 & DCS 동시 만족 검색 <br/><span className="text-sm font-normal text-rose-200 mt-2 block">(특정 벤더 교집합 조건)</span>
                                    </button>
                                </main>
                            </div>
                        );

                    case Page.VendorSelect:
                        const vList = getAvailableOptions(searchMode.toLowerCase());
                        return (
                            <div className="flex flex-col h-full">
                                <Header onBack={back} title={`${searchMode} 벤더사 선택`} />
                                <div className="p-5 grid grid-cols-2 gap-3 overflow-y-auto content-start">
                                    {vList.map(v => (
                                        <button key={v} onClick={() => executeSearch(searchMode, searchMode==='NW'?v:'', searchMode==='DCS'?v:'')} 
                                            className="py-5 rounded-lg font-bold text-lg bg-slate-700 hover:bg-slate-600 shadow border border-slate-600 transition">
                                            {v}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        );

                    case Page.DualSelect:
                        const nwOpts = getAvailableOptions('nw');
                        const dcsOpts = getAvailableOptions('dcs');
                        return (
                            <div className="flex flex-col h-full">
                                <Header onBack={back} title="망 & DCS 상세 검색" />
                                <div className="p-5 flex flex-col gap-6">
                                    <div>
                                        <label className="block font-bold mb-3 text-blue-300">1. 네트워크망 선택</label>
                                        <select value={selNw} onChange={e=>setSelNw(e.target.value)} className="w-full p-4 bg-slate-800 rounded-lg text-lg border border-slate-600 outline-none">
                                            <option value="">-- 선택하세요 --</option>
                                            {nwOpts.map(o => <option key={o} value={o}>{o}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block font-bold mb-3 text-purple-300">2. DCS 선택</label>
                                        <select value={selDcs} onChange={e=>setSelDcs(e.target.value)} className="w-full p-4 bg-slate-800 rounded-lg text-lg border border-slate-600 outline-none">
                                            <option value="">-- 선택하세요 --</option>
                                            {dcsOpts.map(o => <option key={o} value={o}>{o}</option>)}
                                        </select>
                                    </div>
                                    <button onClick={() => executeSearch('BOTH', selNw, selDcs)} disabled={!selNw || !selDcs} 
                                        className="mt-6 bg-rose-600 py-4 rounded-lg font-bold text-xl disabled:bg-slate-700 disabled:text-slate-500 shadow-lg transition">
                                        조회하기
                                    </button>
                                </div>
                            </div>
                        );

                    case Page.ResultList: return <StatusResultPage />;
                    case Page.Settings: return <SettingsPage />;
                    default: return null;
                }
            };

            return (
                <div className="max-w-md mx-auto bg-slate-900 h-full shadow-2xl relative">
                    {renderContent()}
                    
                    {showExitModal && (
                        <div className="absolute inset-0 bg-black/80 flex items-center justify-center z-50 animate-[fadeIn_0.1s_ease-out]">
                            <div className="bg-slate-800 p-6 rounded-xl w-4/5 text-center shadow-2xl border border-slate-600">
                                <h3 className="text-xl font-bold mb-2 text-white">앱을 종료하시겠습니까?</h3>
                                <p className="text-sm text-slate-400 mb-6">뒤로가기를 한 번 더 누르셔도 종료됩니다.</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowExitModal(false)} className="flex-1 py-3 rounded-lg bg-indigo-600 font-bold text-white transition hover:bg-indigo-500">
                                        계속 사용
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
