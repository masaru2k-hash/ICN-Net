            for (let i = 0; i < items.length; i++) {
                const item = items[i]; 
                const cs = item.querySelector('codeshare')?.textContent?.trim();
                if (cs === 'Slave' || cs === 'slave') continue; 
                
                const flightId = item.querySelector('flightId')?.textContent ?? '';

 const applyFilter=(nextMode=mode,nextNw=nw,nextDcs=dcs)=>{if(nextMode==='NW'&&!nextNw||nextMode==='DCS'&&!nextDcs||nextMode==='BOTH'&&(!nextNw||!nextDcs))return;const codes=termCodes.filter(k=>{const a=data[k];return(nextMode==='DCS'||a.nw.some(x=>x.toUpperCase()===nextNw))&&(nextMode==='NW'||a.dcs.some(x=>x.toUpperCase()===nextDcs))});setSelected(new Set(codes));setMatched([]);setFilterText(nextMode==='NW'?nextNw:nextMode==='DCS'?nextDcs:`${nextNw} + ${nextDcs}`);setMobileStep(1)};
 const toggle=(code)=>setSelected(prev=>{const n=new Set(prev);n.has(code)?n.delete(code):n.add(code);return n});
 const runQuery=()=>{setMatched([...selected].sort());setMobileStep(2);if(!flights.length)loadFlights()};
 const results=useMemo(()=>makeResults(matched,flights,data,now),[matched,flights,data,now]);
 const groups=[{id:'CHECK_IN',name:'수속 진행중 (체크인)',color:'#0e997b'},{id:'NOT_OPEN',name:'오픈 대기중',color:'#bb7b15'},{id:'CLOSED',name:'마감 / 종료',color:'#8292a6'},{id:'NO_FLIGHT',name:'조회 운항 없음',color:'#8292a6'}];
 const statusSave=(iata,text)=>{if(!text.trim())return;const value={text:text.trim(),time:timeOf(`${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`)};setStatuses(p=>({...p,[iata]:value}));setRecent(p=>[text.trim(),...p.filter(x=>x!==text.trim())].slice(0,10))};
 const saveForm=()=>{const iata=form.iata.trim().toUpperCase();if(!/^[A-Z0-9]{2,3}$/.test(iata)){alert('항공사 코드를 확인하세요.');return}setData(p=>({...p,[iata]:{term:form.term,nw:form.nw.split(',').map(x=>x.trim()).filter(Boolean),dcs:form.dcs.split(',').map(x=>x.trim()).filter(Boolean)}}));setEditing('')};
 const exportImage=async()=>{setReportBusy(true);try{const node=document.getElementById('export-report');if(!node)throw Error('보고서 영역 없음');const canvas=await window.html2canvas(node,{backgroundColor:'#ffffff',scale:2,useCORS:true,logging:false,windowWidth:1000});const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('이미지 생성 실패');const filename=`ICN_${term}_${filterText.replace(/[^A-Za-z0-9가-힣]+/g,'_')}_${Date.now()}.png`;const file=new File([blob],filename,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'ICN 운항 현황'});return}catch(e){if(e.name==='AbortError')return}}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){alert('이미지 저장 실패: '+e.message)}finally{setReportBusy(false)}};
 const openSettings=()=>{setSettings(true);setInstallPanel(false)};
 const resetAll=()=>{if(confirm('항공사 기본 목록으로 복원하시겠습니까? 사용자 수정 내역이 초기화됩니다.'))setData(DEFAULT_AIRLINE_INFO)};
 if(!auth)return <div className="min-h-screen flex items-center justify-center p-4"><div className="glass p-8 w-full max-w-sm text-center"><div className="text-4xl mb-3">✈️</div><h1 className="text-2xl font-black mb-2">ICN Ops Monitor</h1><p className="hint mb-6">공항 장애/현황 모니터링</p><form onSubmit={e=>{e.preventDefault();if(pin==='1234'){localStorage.setItem('appAuthSession',JSON.stringify({timestamp:Date.now()}));setAuth(true)}else{alert('접근 코드가 일치하지 않습니다.');setPin('')}}}><input className="field text-center text-xl tracking-widest mb-3" type="password" value={pin} onChange={e=>setPin(e.target.value)} placeholder="접근 코드"/><button className="btn primary w-full" type="submit">접속</button></form><p className="hint mt-4">실서비스에서는 서버 인증으로 교체해야 합니다.</p></div></div>;
 const FilterPanel=<section className="glass p-4 mb-4"><h2 className="section-title">① 조회 조건</h2><p className="hint mb-3">장애 발생 터미널과 조회 기준을 선택하세요.</p><div className="flex gap-2 mb-4">{['T1','T2'].map(t=><button key={t} className={'btn flex-1 '+(term===t?'selected':'')} onClick={()=>setTerm(t)}>{t} 터미널</button>)}</div><div className="flex gap-2 mb-4">{[['NW','네트워크'],['DCS','DCS'],['BOTH','교집합']].map(([k,v])=><button key={k} className={'btn flex-1 text-sm '+(mode===k?'selected':'')} onClick={()=>{setMode(k);setMatched([])}}>{v}</button>)}</div>{mode!=='DCS'&&<label className="block mb-3 text-sm font-bold">네트워크망<select className="field mt-1" value={nw} onChange={e=>setNw(e.target.value)}><option value="">망 선택</option>{nwOptions.map(v=><option key={v}>{v}</option>)}</select></label>}{mode!=='NW'&&<label className="block mb-3 text-sm font-bold">DCS<select className="field mt-1" value={dcs} onChange={e=>setDcs(e.target.value)}><option value="">DCS 선택</option>{dcsOptions.map(v=><option key={v}>{v}</option>)}</select></label>}<button className="btn primary w-full" disabled={mode==='NW'&&!nw||mode==='DCS'&&!dcs||mode==='BOTH'&&(!nw||!dcs)} onClick={()=>applyFilter()}>조건에 맞는 항공사 목록 보기 →</button></section>;
 const AirlinePanel=<section className="glass p-4 mb-4"><div className="flex items-center justify-between gap-2"><h2 className="section-title">② 항공사 예외 선택</h2><span className="pill bg-blue-50 text-blue-700">{selected.size}개 선택</span></div><div className="notice mb-3">조건에 해당하는 항공사를 자동 선택합니다. 예외 항공사는 직접 선택 해제하거나 추가한 뒤 조회하세요.</div><div className="subtle p-3 mb-3 text-sm"><b>{term} · {filterText||'조회 조건을 먼저 선택하세요'}</b><div className="hint mt-1">선택된 항공사만 운항 현황을 조회합니다.</div></div><div className="flex gap-2 mb-3"><button className="btn text-xs flex-1" onClick={()=>setSelected(new Set(termCodes))}>전체 선택</button><button className="btn text-xs flex-1" onClick={()=>setSelected(new Set())}>전체 해제</button><button className="btn text-xs flex-1" onClick={()=>applyFilter()}>조건 복원</button></div><div className="card-list mb-4">{termCodes.map(k=><button key={k} className={'air-btn '+(selected.has(k)?'selected':'')} onClick={()=>toggle(k)} aria-pressed={selected.has(k)}>{k}</button>)}</div><div className="mobile-footer"><button className="btn primary w-full" disabled={!selected.size} onClick={runQuery}>선택 항공사 조회 ({selected.size}개) →</button></div></section>;

 const renderCard=(r)=>{const st=statuses[r.iata];return <FlightCard key={r.iata} r={r} status={st} recent={recent} onSave={statusSave}/>};
 const ResultPanel=<section className="glass p-4 mb-4 results-col"><div className="flex justify-between items-start gap-3 flex-wrap"><div><h2 className="section-title mb-1">③ 운항 현황 <span className="text-blue-600">({matched.length}개사)</span></h2><p className="hint">{term} · {filterText} · {fmt(now)} 기준</p><p className="hint">API 마지막 갱신: {lastUpdated?fmt(lastUpdated):'없음'}</p></div><div className="flex gap-2"><button className="btn text-sm" onClick={loadFlights} disabled={loading}>{loading?'갱신 중':'↻ 새로고침'}</button><button className="btn primary text-sm" disabled={!matched.length||loading||!!fetchError} onClick={()=>setReportOpen(true)}>▣ 이미지 내보내기</button></div></div>{fetchError&&<div className="notice my-3">{fetchError} 기존 데이터가 남아 있다면 이전 조회 결과일 수 있습니다.</div>}{loading&&<div className="hint py-3">운항정보를 갱신하고 있습니다…</div>}{!matched.length?<div className="subtle p-8 text-center hint mt-4">항공사를 선택하고 조회 버튼을 누르면 결과가 표시됩니다.</div>:<div className="mt-4">{groups.map(g=>{const list=results.filter(r=>r.state===g.id);if(!list.length)return null;if(['CLOSED','NO_FLIGHT'].includes(g.id)&&!showClosed)return null;return <div key={g.id} className="mb-6"><div className="flex justify-between items-center border-b pb-2 mb-3"><h3 className="font-black" style={{color:g.color}}>{g.name}</h3><b>{list.length}</b></div><div className="result-grid">{list.map(renderCard)}</div></div>})}<button className="btn w-full" onClick={()=>setShowClosed(!showClosed)}>{showClosed?'마감/운항 없음 접기':'마감/운항 없음 보기'} ({results.filter(r=>['CLOSED','NO_FLIGHT'].includes(r.state)).length})</button></div>}</section>;
 const SettingsPanel=<section className="glass p-5"><div className="flex justify-between items-center mb-4"><h2 className="text-xl font-black">데이터 설정 및 관리</h2><button className="btn" onClick={()=>setSettings(false)}>닫기</button></div><div className="subtle p-4 mb-4"><h3 className="section-title">앱 설치 및 실행</h3><p className="hint mb-3">{installer.installed?'설치형 앱으로 실행 중입니다.':installer.canPrompt?'이 브라우저에서 설치창을 열 수 있습니다.':'브라우저별 설치 안내를 확인하세요.'}</p>{installer.canPrompt&&!installer.installed&&<button className="btn primary mr-2" onClick={installer.install}>앱 설치</button>}<button className="btn" onClick={()=>setInstallPanel(!installPanel)}>설치 방법 {installPanel?'접기':'보기'}</button>{installPanel&&<div className="notice mt-3">{getInstallHelp()}</div>}{installer.outcome&&<p className="hint mt-2">{installer.outcome}</p>}</div><div className="subtle p-4 mb-5"><h3 className="section-title">데이터 초기화</h3><div className="flex gap-2 flex-wrap"><button className="btn" onClick={resetAll}>기본 항공사 목록 복원</button><button className="btn" onClick={()=>{if(confirm('모든 항공사 장애 상태를 삭제할까요?'))setStatuses({})}}>장애 상태 비우기</button><button className="btn" onClick={()=>{if(confirm('자동완성 기록을 삭제할까요?'))setRecent([])}}>자동완성 비우기</button></div></div><div className="flex justify-between items-center mb-3"><h3 className="section-title">항공사 NW / DCS 정보</h3><button className="btn primary text-sm" onClick={()=>{setEditing('NEW');setForm({iata:'',term:'T1',nw:'',dcs:''})}}>신규 추가</button></div>{editing&&<div className="subtle p-4 mb-4"><div className="grid grid-cols-2 gap-3 mb-3"><label className="text-sm">항공사 코드<input disabled={editing!=='NEW'} className="field mt-1" value={form.iata} onChange={e=>setForm({...form,iata:e.target.value})}/></label><label className="text-sm">터미널<select className="field mt-1" value={form.term} onChange={e=>setForm({...form,term:e.target.value})}><option>T1</option><option>T2</option></select></label></div><label className="block text-sm mb-3">네트워크 (쉼표 구분)<input className="field mt-1" value={form.nw} onChange={e=>setForm({...form,nw:e.target.value})}/></label><label className="block text-sm mb-3">DCS (쉼표 구분)<input className="field mt-1" value={form.dcs} onChange={e=>setForm({...form,dcs:e.target.value})}/></label><div className="flex gap-2"><button className="btn" onClick={()=>setEditing('')}>취소</button><button className="btn primary" onClick={saveForm}>저장</button></div></div>}<div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-2">{Object.keys(data).sort().map(k=><button key={k} className="subtle p-3 text-left" onClick={()=>{setEditing(k);setForm({iata:k,term:data[k].term,nw:data[k].nw.join(', '),dcs:data[k].dcs.join(', ')})}}><b className="text-blue-700">{k} <small className="text-slate-500">{data[k].term}</small></b><div className="hint">NW: {data[k].nw.join(', ')}<br/>DCS: {data[k].dcs.join(', ')}</div></button>)}</div></section>;
 const report=<div id="export-report" className="report"><div style={{borderBottom:'4px solid #3670d8',paddingBottom:18}}><div style={{fontSize:13,color:'#64748b'}}>INCHEON AIRPORT · OPERATIONS MONITOR</div><h1 style={{fontSize:30,margin:'7px 0'}}>공항 장애/운항 현황 보고</h1><div style={{fontSize:16}}>{term} | {filterText} | {fmt(now)}</div><div style={{fontSize:13,color:'#60758a',marginTop:7}}>선택 항공사 {matched.length}개 · 데이터 갱신 {lastUpdated?fmt(lastUpdated):'없음'}</div></div><div style={{display:'flex',gap:12,marginTop:18}}>{groups.map(g=><div key={g.id} style={{flex:1,padding:14,background:'#f1f7fd',borderRadius:10}}><div style={{fontSize:12}}>{g.name}</div><b style={{fontSize:25,color:g.color}}>{results.filter(r=>r.state===g.id).length}</b></div>)}</div>{groups.map(g=>{const list=results.filter(r=>r.state===g.id);return list.length?<div className="report-group" key={g.id}><h3 style={{color:g.color}}>{g.name} ({list.length})</h3>{list.map(r=>{const st=statuses[r.iata];return <div className="report-row" key={r.iata}><div style={{minWidth:120}}><b>{r.iata}</b> <span style={{fontSize:12,color:'#687d90'}}>{r.flight?.airline||''}</span></div><div style={{flex:1,fontSize:13}}>{r.flight?`${r.flight.flightId} · ${r.flight.airport} · ${timeOf(r.flight.scheduleDateTime)} 출발`:g.name}{r.state==='NOT_OPEN'&&` · ${r.openTime} 오픈 예정`}{st?.text&&<div style={{color:'#b34858',marginTop:4}}>장애 상태: {st.text} ({st.time||''})</div>}</div><span className="report-badge">{r.gate?'G'+r.gate+' · ':''}{r.counter||'-'}</span></div>})}</div>:null})}<div style={{fontSize:11,color:'#8292a6',marginTop:26,borderTop:'1px solid #dce8f3',paddingTop:10}}>본 자료는 공공 운항정보 기반의 참고용 조회 결과이며, 실제 장애 여부는 현장 확인이 필요합니다.</div></div>;
 return <div className="shell"><header className="topbar"><div><h1 className="text-2xl font-black">✈️ 공항 장애/현황 모니터링</h1><p className="hint">ICN Ops Monitor · Network / DCS Operations</p></div><div className="flex gap-2"><button className="btn" onClick={loadFlights} disabled={loading} title="운항정보 갱신">↻ <span className="mobile-hide">새로고침</span></button><button className="btn" onClick={openSettings}>⚙ <span className="mobile-hide">설정</span></button></div></header>{settings?SettingsPanel:<><div className="mobile-only mb-3"><div className="flex gap-2">{['조건','항공사','결과'].map((x,i)=><button key={x} className={'btn flex-1 text-sm '+(mobileStep===i?'selected':'')} onClick={()=>setMobileStep(i)}>{i+1}. {x}</button>)}</div></div><div className="desktop-grid"><div className={mobileStep===0?'':'mobile-hide'}>{FilterPanel}</div><div className={mobileStep===1?'':'mobile-hide'}>{AirlinePanel}</div><div className={'results-col '+(mobileStep===2?'':'mobile-hide')}>{ResultPanel}</div></div></>}{reportOpen&&<div style={{position:'fixed',inset:0,zIndex:60,background:'rgba(17,40,63,.65)',overflow:'auto',padding:'18px'}}><div className="glass p-4 mx-auto" style={{maxWidth:950}}><div className="flex justify-between items-center gap-2 mb-3"><h2 className="font-black">이미지 보고서 미리보기</h2><div className="flex gap-2"><button className="btn primary" disabled={reportBusy} onClick={exportImage}>{reportBusy?'이미지 생성 중':'PNG 저장 / 공유'}</button><button className="btn" onClick={()=>setReportOpen(false)}>닫기</button></div></div><div style={{overflowX:'auto'}}>{report}</div></div></div>}</div>
}
function FlightCard({r,status,recent,onSave}){const [expanded,setExpanded]=useState(false),[input,setInput]=useState('');const wait=r.state==='NOT_OPEN';const off=!r.flight;return <article className={'stat '+(wait?'wait':off?'off':'')}><div className="flex justify-between gap-2 items-start"><div><div className="font-black text-xl">{r.iata} <span className="font-normal text-sm text-slate-500">{r.flight?.airline||''}</span></div><div className="text-sm text-slate-600 mt-1">{r.flight?`${r.flight.flightId} | ${r.flight.airport} | ${timeOf(r.flight.scheduleDateTime)} 출발`:(r.state==='CLOSED'?'운항 종료':'조회 운항 없음')}</div></div><div className="text-right shrink-0"><div className="flex gap-1 justify-end">{r.gate&&<span className="pill bg-slate-100 text-slate-600">G{r.gate}</span>}{r.counter&&<span className={'pill '+(wait?'bg-amber-100 text-amber-800':'bg-emerald-100 text-emerald-800')}>{r.counter}</span>}</div>{wait&&<div className="text-xs font-bold text-amber-700 mt-2">{r.openTime} 오픈 예상</div>}</div></div>{status?.text&&<div className="notice mt-3" style={{background:'#fff0f2',color:'#a53b51'}}>상태: {status.text} {status.time&&`(${status.time})`}</div>}<button className="text-xs text-blue-600 font-bold mt-3" onClick={()=>setExpanded(!expanded)}>{expanded?'상태 입력 닫기':'장애 상태 입력 / 수정'}</button>{expanded&&<div className="mt-3 flex flex-col gap-2"><input className="field" placeholder="예: 응답 지연 → 수기 발권" value={input} onChange={e=>setInput(e.target.value)}/>{recent.length>0&&<select className="field" value="" onChange={e=>setInput(e.target.value)}><option value="">기존 입력 불러오기</option>{recent.map(v=><option key={v} value={v}>{v}</option>)}</select>}<button className="btn primary" onClick={()=>{onSave(r.iata,input);setExpanded(false);setInput('')}}>상태 저장</button></div>}</article>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(console.warn))}</script></body></html>
